services:
  - type: web
    name: psb-world-class-hrdm
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: psb-hrdm-files
      - key: PUBLIC_URL
        value: https://training.psbureau.org
      - key: APP_ENV
        value: production
      - key: APP_THEME
        value: light
      - key: APP_SECRET_KEY
        sync: false
      - key: DEFAULT_CEO_PASSWORD
        sync: false
      - key: SESSION_TIMEOUT_MINUTES
        value: "30"
      - key: LOGIN_LOCKOUT_ATTEMPTS
        value: "5"
